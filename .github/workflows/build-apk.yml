name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config cmake gettext autopoint \
            build-essential ccache \
            libffi-dev libssl-dev zlib1g-dev \
            libncurses-dev
          # libltdl-dev supplies LT_SYS_SYMBOL_USCORE for the libffi recipe
          # (same fix as kivy/buildozer#1960).

      - name: Install Buildozer
        run: |
          python -m pip install -U pip wheel
          python -m pip install "buildozer==1.6.0" "Cython==0.29.36" virtualenv

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fourwaytd-apk
          path: bin/*.apk
          if-no-files-found: error
